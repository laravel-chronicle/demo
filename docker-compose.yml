# Deploys the MedLedger demo behind an existing Traefik reverse proxy.
# Traefik terminates TLS; this container serves plain HTTP on :8080 and
# publishes no ports of its own (Docker's published ports bypass ufw).
#
# Assumes the Traefik setup from quietsysadmin/stacks base/: an external
# "proxy" network, a "websecure" entrypoint and a "le" cert resolver.

services:
    app:
        image: ghcr.io/laravel-chronicle/demo:latest
        restart: unless-stopped
        env_file:
            - path: .env.production
              required: true
        volumes:
            - medledger_data:/data
        networks:
            - proxy
        labels:
            - traefik.enable=true
            - traefik.http.routers.medledger.rule=Host(`demo.laravel-chronicle.dev`)
            - traefik.http.routers.medledger.entrypoints=websecure
            - traefik.http.routers.medledger.tls.certresolver=le
            - traefik.http.services.medledger.loadbalancer.server.port=8080
        security_opt:
            - no-new-privileges:true
        healthcheck:
            test: ["CMD", "curl", "-fsS", "http://localhost:8080/up"]
            interval: 15s
            timeout: 3s
            retries: 5
            start_period: 30s

volumes:
    medledger_data:

networks:
    proxy:
        external: true
